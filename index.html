function grid(){
  const list = tours.filter(x=>L(x.titulo).toLowerCase().includes(q.trim().toLowerCase()));
  $('count').textContent = tours.length ? t('count')(list.length) : '';
  $('fx').textContent = cur!=='CLP' ? '≈ '+t('fx') : '';
  $('grid').innerHTML = list.map(x=>`<article class="bg-white rounded-2xl shadow-md hover:shadow-xl transition overflow-hidden flex flex-col">
      <img src="${esc((x.imagenes||[])[0])}" alt="${esc(L(x.titulo))}" loading="lazy" class="h-48 w-full object-cover bg-slate-200">
      <div class="p-5 flex-1 flex flex-col gap-3">
        <h3 class="font-bold text-xl text-sky-950 leading-snug">${esc(L(x.titulo))}</h3>
        <div class="flex flex-wrap gap-2 text-sm text-slate-700">
          <span class="inline-flex items-center gap-1.5 bg-slate-100 rounded-full px-3 py-1">${ic('clock')}${esc(L(x.duracion))}</span>
          <span class="inline-flex items-center gap-1.5 bg-slate-100 rounded-full px-3 py-1">${ic('pin')}${esc(x.punto_encuentro)}</span></div>
        <p class="text-sm text-slate-600">${esc(L(x.descripcion))}</p>

      </div></article>`).join('') || `<p class="col-span-full text-center text-slate-600 py-10">${loadErr?t('loaderr'):(tours.length?t('none'):'…')}</p>`;

  $('modal').innerHTML=`<div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3" onclick="if(event.target===this)closeModal()">
   <div role="dialog" aria-modal="true" aria-label="${t('portal')}" class="bg-white rounded-2xl w-full max-w-sm p-6 space-y-4">
    <div class="flex justify-between items-start gap-3"><div><h3 class="font-bold text-xl text-sky-950">${t('portal')}</h3><p class="text-sm text-slate-600">${t('pass_t')}</p></div>
     <button onclick="closeModal()" aria-label="${t('close')}" class="w-11 h-11 -mr-2 -mt-2 text-2xl leading-none rounded-full hover:bg-slate-100">×</button></div>
    ${msg?`<p role="alert" class="text-sm text-rose-700">${esc(msg)}</p>`:''}

}
async function entrarSocio(){
  const {error}=await sb.auth.signInWithPassword({email:$('lem').value.trim(),password:$('lpw').value});
  if(error) return loginModal(error.message);
  location.href=PANEL_URL;
}

// ---------- Reserva ----------
async function open_(id){
  sel=tours.find(x=>x.id===id); pax=[{}]; disp={}; fechaSel=null; err=''; busy=false;
  const hoy=new Date(), fin=new Date(Date.now()+180*864e5); maxFecha=isoD(fin);
  mes=new Date(hoy.getFullYear(),hoy.getMonth(),1);
  const {data}=await sb.rpc('disponibilidad',{p_tour:id,p_desde:isoD(hoy),p_hasta:isoD(fin)});
  (data||[]).forEach(r=>disp[r.fecha]=r.disponibles);
  modal(); focusModal();
}
function mover(n){ mes=new Date(mes.getFullYear(),mes.getMonth()+n,1); modal(); }
function elegir(f){ fechaSel=f; err=''; const max=disp[f]; if(pax.length>max) pax=pax.slice(0,max); modal(); }
function addPax(){ if(fechaSel && pax.length>=disp[fechaSel]){ err=t('maxp'); return modal(); } pax.push({}); modal(); }
function setP(i,k,v){ pax[i][k]=v; }

function calendario(){
  const y=mes.getFullYear(), m=mes.getMonth(), off=(new Date(y,m,1).getDay()+6)%7, n=new Date(y,m+1,0).getDate();
  const hoy=new Date(), esPrimero=(y===hoy.getFullYear()&&m===hoy.getMonth());
  const finM=new Date(maxFecha+'T00:00'); const esUltimo=(y===finM.getFullYear()&&m===finM.getMonth());
  const dias=[...Array(7)].map((_,i)=>new Intl.DateTimeFormat(loc(),{weekday:'short'}).format(new Date(2024,0,1+i)));
  let celdas=''; for(let i=0;i<off;i++) celdas+='<div></div>';
  for(let d=1; d<=n; d++){
    const f=iso(y,m,d), v=disp[f], ok=v>0, act=f===fechaSel;
    celdas+= ok
     ? `<button onclick="elegir('${f}')" aria-pressed="${act}" aria-label="${d}, ${v} ${t('avail')}" class="aspect-square min-h-[44px] rounded-xl flex flex-col items-center justify-center transition ${act?'bg-orange-700 text-white shadow-lg scale-105':'bg-sky-50 hover:bg-sky-100 text-sky-950'}">
         <span class="font-bold">${d}</span><span class="text-[11px] font-semibold ${act?'text-white':'text-emerald-800'}">${v} ${t('avail')}</span></button>`
     : `<div class="aspect-square flex items-center justify-center text-slate-400 text-sm ${v===0?'line-through':''}" aria-hidden="true">${d}</div>`;
  }
  return `<div class="border rounded-2xl p-3 bg-white">
    <div class="flex items-center justify-between mb-2">
      <button onclick="mover(-1)" aria-label="‹" ${esPrimero?'disabled':''} class="w-11 h-11 rounded-full bg-slate-100 disabled:opacity-30 text-lg">‹</button>
      <b class="capitalize text-sky-950">${new Intl.DateTimeFormat(loc(),{month:'long',year:'numeric'}).format(mes)}</b>
      <button onclick="mover(1)" aria-label="›" ${esUltimo?'disabled':''} class="w-11 h-11 rounded-full bg-slate-100 disabled:opacity-30 text-lg">›</button></div>
    <div class="grid grid-cols-7 gap-1 text-center text-xs text-slate-600 mb-1">${dias.map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="grid grid-cols-7 gap-1">${celdas}</div>
    <p class="text-center text-sm mt-3 ${fechaSel?'text-orange-800 font-semibold':'text-slate-600'}">${fechaSel? new Intl.DateTimeFormat(loc(),{dateStyle:'full'}).format(new Date(fechaSel+'T00:00')) : t('pick')}</p></div>`;
}
function campo(i,k,label,type,ac,req,full){
  return `<label class="block text-xs font-medium text-slate-700 ${full?'col-span-2':''}">${label}${req?' *':''}
   <input type="${type}" autocomplete="${ac}" ${req?'required':''} value="${esc(pax[i][k])}" oninput="setP(${i},'${k}',this.value)" class="mt-1 block w-full border border-slate-300 rounded-lg p-2.5 text-base text-slate-900"></label>`;
}
function modal(msg){
  $('modal').innerHTML = `<div class="fixed inset-0 bg-black/60 z-50 overflow-auto p-0 sm:p-6" onclick="if(event.target===this)closeModal()">
  <div role="dialog" aria-modal="true" aria-label="${esc(L(sel.titulo))}" class="bg-white sm:rounded-2xl max-w-xl mx-auto min-h-full sm:min-h-0 flex flex-col">
   <div class="sticky top-0 z-10 bg-white sm:rounded-t-2xl flex justify-between items-center gap-3 px-5 py-3 border-b">
     <h3 class="font-bold text-xl text-sky-950">${esc(L(sel.titulo))}</h3>
     <button onclick="closeModal()" aria-label="${t('close')}" class="w-11 h-11 -mr-2 text-2xl leading-none rounded-full hover:bg-slate-100">×</button></div>
   ${msg?`<div class="m-5 p-4 bg-emerald-50 rounded-lg text-emerald-900" role="status">${msg}</div>`:`
   <div class="flex-1 p-5 space-y-3">
    ${calendario()}
    ${pax.map((p,i)=>`<fieldset class="border rounded-xl p-3 grid grid-cols-2 gap-2"><legend class="px-1 text-xs font-semibold text-slate-600">#${i+1}</legend>
      ${campo(i,'nombre',t('name'),'text','name',true,true)}${campo(i,'documento',t('doc'),'text','off',true)}${campo(i,'telefono',t('tel'),'tel','tel',false)}
      ${campo(i,'correo',t('mail'),'email','email',true,true)}${campo(i,'detalles',t('extra'),'text','off',false,true)}</fieldset>`).join('')}
    <button onclick="addPax()" class="text-sky-800 font-semibold text-sm min-h-[44px]">${t('add')}</button>
    ${err?`<p role="alert" class="text-sm text-rose-700 font-medium">${esc(err)}</p>`:''}
   </div>
   <div class="sticky bottom-0 bg-white sm:rounded-b-2xl border-t px-5 py-3 flex items-center justify-between gap-3">
    <div><b class="text-lg text-sky-950">${t('total')}: ${money(sel.precio_clp*pax.length)}</b>${cur!=='CLP'?`<span class="block text-[11px] text-slate-600">≈ ${t('fx')}</span>`:''}</div>
    <button onclick="pagar()" ${busy?'disabled':''} class="${BTN} px-6 py-3 min-h-[44px] disabled:opacity-60">${busy?t('paying'):t('pay')}</button></div>`}
  </div></div>`;
}
async function pagar(){
  if(busy) return;
  if(!fechaSel){ err=t('pick'); return modal(); }
  if(pax.some(p=>!p.nombre?.trim()||!p.documento?.trim()||!p.correo?.trim())){ err=t('req'); return modal(); }
  err=''; busy=true; modal();
  const {data:r,error}=await sb.rpc('crear_reserva',{p_tour:sel.id,p_fecha:fechaSel,p_participantes:pax});
  if(error){ busy=false; err=error.message; return modal(); }
  // AQUÍ después: redirigir a Webpay/Mercado Pago (Edge Function). Por ahora se simula el pago:
  const {data:p,error:e2}=await sb.rpc('simular_pago',{p_reserva:r.id});
  busy=false; if(e2){ err=e2.message; return modal(); }
  modal(`<b>${t('ok')}</b><br>${t('code')}: <b>${esc(p.codigo)}</b><br>${esc(fechaSel)} · ${p.cantidad_personas} · ${money(p.monto_total)}`);
}
load();
</script></body></html>
