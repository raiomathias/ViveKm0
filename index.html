<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vive Km 0 · Patagonia Chilena</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
<script>
// ====== CONFIGURA AQUÍ ======
const SUPABASE_URL = 'https://tqvvgpwfbpulethdhufe.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxdnZncHdmYnB1bGV0aGRodWZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0NTQ0ODUsImV4cCI6MjEwOTAzMDQ4NX0.-Me-wMMdBWOR63dh0CQUa42Wf2i-0gGrNknFqRWdXSU';
const TASAS = { CLP: 1, USD: 1/950, BRL: 1/175 }; // CLP -> moneda. Ajusta o conecta una API de cambio.
// ============================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const T = {
  es:{hero:'Vive la Patagonia chilena',sub:'Aventuras guiadas en la franja austral',search:'Buscar tour…',inc:'Incluye',noinc:'No incluye',meet:'Punto de encuentro',pp:'por persona',book:'Reservar',date:'Fecha',pax:'Pasajeros',name:'Nombre completo',doc:'Documento / Pasaporte',mail:'Correo',tel:'Teléfono',extra:'Restricciones alimentarias / tallas',pay:'Pagar (simulado)',total:'Total',full:'Sin cupos',ok:'¡Reserva confirmada!',code:'Código',add:'+ Agregar pasajero',avail:'cupos',close:'Cerrar',none:'Sin resultados'},
  pt:{hero:'Viva a Patagônia chilena',sub:'Aventuras guiadas na faixa austral',search:'Buscar passeio…',inc:'Inclui',noinc:'Não inclui',meet:'Ponto de encontro',pp:'por pessoa',book:'Reservar',date:'Data',pax:'Passageiros',name:'Nome completo',doc:'Documento / Passaporte',mail:'E-mail',tel:'Telefone',extra:'Restrições alimentares / tamanhos',pay:'Pagar (simulado)',total:'Total',full:'Esgotado',ok:'Reserva confirmada!',code:'Código',add:'+ Adicionar passageiro',avail:'vagas',close:'Fechar',none:'Sem resultados'},
  en:{hero:'Live Chilean Patagonia',sub:'Guided adventures in the austral strip',search:'Search tours…',inc:'Included',noinc:'Not included',meet:'Meeting point',pp:'per person',book:'Book now',date:'Date',pax:'Guests',name:'Full name',doc:'ID / Passport',mail:'Email',tel:'Phone',extra:'Dietary restrictions / sizes',pay:'Pay (simulated)',total:'Total',full:'Sold out',ok:'Booking confirmed!',code:'Code',add:'+ Add guest',avail:'spots',close:'Close',none:'No results'}
};
let lang = localStorage.lang || (navigator.language.startsWith('pt')?'pt':navigator.language.startsWith('en')?'en':'es');
let cur = localStorage.cur || (lang==='pt'?'BRL':'CLP');
let tours = [], q = '', sel = null, disp = {}, pax = [];
const t = k => T[lang][k];
const L = o => (o && (o[lang]||o.es)) || '';
const money = clp => new Intl.NumberFormat(lang==='pt'?'pt-BR':lang==='en'?'en-US':'es-CL',{style:'currency',currency:cur,maximumFractionDigits:cur==='CLP'?0:2}).format(clp*TASAS[cur]);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

async function load(){ const {data}=await sb.from('tours').select('*').eq('activo',true); tours=data||[]; render(); }

function render(){
  const list = tours.filter(x=>L(x.titulo).toLowerCase().includes(q.toLowerCase()));
  document.body.innerHTML = `
  <header class="relative h-[70vh] min-h-[420px] bg-cover bg-center" style="background-image:linear-gradient(rgba(15,50,80,.55),rgba(15,50,80,.75)),url('https://images.unsplash.com/photo-1531761535209-180857e963b9?w=1600')">
    <nav class="flex justify-between items-center p-4 text-white">
      <b class="text-xl">⛰ Vive Km 0</b>
      <div class="flex gap-2 text-sm">
        <select onchange="lang=this.value;localStorage.lang=lang;render()" class="text-slate-800 rounded px-2 py-1">${['es','pt','en'].map(l=>`<option ${l===lang?'selected':''}>${l}</option>`).join('')}</select>
        <select onchange="cur=this.value;localStorage.cur=cur;render()" class="text-slate-800 rounded px-2 py-1">${Object.keys(TASAS).map(c=>`<option ${c===cur?'selected':''}>${c}</option>`).join('')}</select>
      </div></nav>
    <div class="absolute inset-0 flex flex-col items-center justify-center text-center text-white px-4">
      <h1 class="text-4xl md:text-6xl font-bold">${t('hero')}</h1><p class="mt-3 text-lg">${t('sub')}</p>
      <input id="q" value="${esc(q)}" placeholder="${t('search')}" oninput="q=this.value;render();$('q').focus();$('q').setSelectionRange(q.length,q.length)" class="mt-6 w-full max-w-md px-4 py-3 rounded-full text-slate-800 outline-none">
    </div></header>
  <main class="max-w-6xl mx-auto p-4 grid gap-6 sm:grid-cols-2 lg:grid-cols-3 -mt-10 relative">
    ${list.map(x=>`<article class="bg-white rounded-2xl shadow overflow-hidden flex flex-col">
      <img src="${esc((x.imagenes||[])[0])}" loading="lazy" class="h-48 w-full object-cover">
      <div class="p-4 flex-1 flex flex-col gap-2">
        <h2 class="font-bold text-lg text-sky-900">${esc(L(x.titulo))}</h2>
        <p class="text-sm text-slate-600">${esc(L(x.descripcion))}</p>
        <p class="text-xs">⏱ ${esc(L(x.duracion))} · 📍 ${esc(x.punto_encuentro)}</p>
        <p class="text-xs"><b class="text-emerald-700">${t('inc')}:</b> ${esc((x.incluye?.[lang]||[]).join(', '))}</p>
        <p class="text-xs"><b class="text-rose-700">${t('noinc')}:</b> ${esc((x.no_incluye?.[lang]||[]).join(', '))}</p>
        <div class="mt-auto flex items-center justify-between pt-2">
          <div><b class="text-xl text-sky-900">${money(x.precio_clp)}</b><span class="text-xs text-slate-500"> ${t('pp')}</span></div>
          <button onclick="open_('${x.id}')" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg">${t('book')}</button></div>
      </div></article>`).join('')||`<p class="col-span-full text-center">${t('none')}</p>`}
  </main><div id="modal"></div>`;
}

async function open_(id){
  sel = tours.find(x=>x.id===id); pax=[{}]; disp={};
  const d0=new Date(), d1=new Date(Date.now()+60*864e5), f=d=>d.toISOString().slice(0,10);
  const {data}=await sb.rpc('disponibilidad',{p_tour:id,p_desde:f(d0),p_hasta:f(d1)});
  (data||[]).forEach(r=>disp[r.fecha]=r.disponibles);
  modal();
}
function modal(msg){
  const fechas = Object.entries(disp).filter(([,v])=>v>0);
  $('modal').innerHTML = `<div class="fixed inset-0 bg-black/60 z-50 overflow-auto p-3"><div class="bg-white rounded-2xl max-w-2xl mx-auto p-5">
   <div class="flex justify-between"><h3 class="font-bold text-xl">${esc(L(sel.titulo))}</h3><button onclick="$('modal').innerHTML=''" class="text-2xl">×</button></div>
   ${msg?`<div class="my-4 p-4 bg-emerald-50 rounded text-emerald-800">${msg}</div>`:`
   <label class="block mt-3 text-sm">${t('date')}
    <select id="f" class="w-full border rounded p-2">${fechas.map(([f,v])=>`<option value="${f}">${f} · ${v} ${t('avail')}</option>`).join('')||`<option value="">${t('full')}</option>`}</select></label>
   <div id="px">${pax.map((p,i)=>`<fieldset class="border rounded p-3 mt-3 grid grid-cols-2 gap-2 text-sm"><legend class="px-1 text-xs">#${i+1}</legend>
     <input placeholder="${t('name')}" value="${esc(p.nombre)}" oninput="pax[${i}].nombre=this.value" class="border rounded p-2 col-span-2">
     <input placeholder="${t('doc')}" value="${esc(p.documento)}" oninput="pax[${i}].documento=this.value" class="border rounded p-2">
     <input placeholder="${t('tel')}" value="${esc(p.telefono)}" oninput="pax[${i}].telefono=this.value" class="border rounded p-2">
     <input placeholder="${t('mail')}" value="${esc(p.correo)}" oninput="pax[${i}].correo=this.value" class="border rounded p-2 col-span-2">
     <input placeholder="${t('extra')}" value="${esc(p.detalles)}" oninput="pax[${i}].detalles=this.value" class="border rounded p-2 col-span-2"></fieldset>`).join('')}</div>
   <button onclick="pax.push({});modal()" class="mt-2 text-sky-700 text-sm">${t('add')}</button>
   <div class="flex justify-between items-center mt-4"><b>${t('total')}: ${money(sel.precio_clp*pax.length)}</b>
    <button onclick="pagar()" class="bg-orange-500 text-white px-5 py-2 rounded-lg">${t('pay')}</button></div>`}
  </div></div>`;
}
async function pagar(){
  const fecha=$('f').value; if(!fecha) return;
  if(pax.some(p=>!p.nombre||!p.documento||!p.correo)) return alert('⚠ '+t('name')+', '+t('doc')+', '+t('mail'));
  const {data:r,error}=await sb.rpc('crear_reserva',{p_tour:sel.id,p_fecha:fecha,p_participantes:pax});
  if(error) return alert(error.message);
  // AQUÍ después: redirigir a Webpay/Mercado Pago (Edge Function). Por ahora se simula el pago:
  const {data:p,error:e2}=await sb.rpc('simular_pago',{p_reserva:r.id});
  if(e2) return alert(e2.message);
  modal(`<b>${t('ok')}</b><br>${t('code')}: <b>${esc(p.codigo)}</b><br>${esc(fecha)} · ${p.cantidad_personas} · ${money(p.monto_total)}`);
}
load();
</script></body></html>
