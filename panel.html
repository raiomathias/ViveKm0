<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel · Vive Km 0</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','ui-sans-serif','system-ui','sans-serif']}}}}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #fb923c;outline-offset:2px}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.up{animation:up .25s ease-out}
</style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen">
<div id="app"></div><div id="modal"></div><div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[60]"></div>
<script>
// ====== CONFIGURA AQUÍ ======
const SUPABASE_URL = 'https://tqvvgpwfbpulethdhufe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_hiBf5GuftI9W9eivIVxgbQ_EBC33zTb';
// ============================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => { const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); };
const D = s => new Date(s+'T00:00');
const fmt = (s,o) => new Intl.DateTimeFormat('es-CL',o).format(D(s));
const clp = n => '$'+Number(n||0).toLocaleString('es-CL')+' CLP';

const IC = {
  plus:'<path stroke-linecap="round" d="M12 5v14M5 12h14"/>',
  edit:'<path stroke-linecap="round" stroke-linejoin="round" d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16v4z"/>',
  trash:'<path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  check:'<path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>',
  left:'<path stroke-linecap="round" stroke-linejoin="round" d="M15 6l-6 6 6 6"/>',
  right:'<path stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/>',
  down:'<path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/>',
  users:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path stroke-linecap="round" d="M3 20a6 6 0 0112 0M15 14.5a5 5 0 016 5.5"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path stroke-linecap="round" d="M3 10h18M8 3v4M16 3v4"/>',
  map:'<path stroke-linecap="round" stroke-linejoin="round" d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/>',
  out:'<path stroke-linecap="round" stroke-linejoin="round" d="M15 17l5-5-5-5M20 12H9M12 4H5v16h7"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  mtn:'<path stroke-linecap="round" stroke-linejoin="round" d="M3 20l6-10 4 6 3-4 5 8z"/>',
  x:'<path stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/>',
  tag:'<path stroke-linecap="round" stroke-linejoin="round" d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1"/>',
  pin:'<path stroke-linecap="round" stroke-linejoin="round" d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path stroke-linecap="round" d="M3 7l9 6 9-6"/>',
  phone:'<path stroke-linecap="round" stroke-linejoin="round" d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>'
};
const ic = (n,c='w-5 h-5') => `<svg class="${c} shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const badge = (txt,cls) => `<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold ${cls}">${txt}</span>`;
const iconBtn = (name,label,cls,onclick) => `<button onclick="${onclick}" aria-label="${label}" title="${label}" class="w-10 h-10 rounded-xl flex items-center justify-center transition ${cls}">${ic(name,'w-[18px] h-[18px]')}</button>`;
const BTN = 'bg-orange-700 hover:bg-orange-800 text-white font-semibold rounded-xl shadow-sm hover:shadow-md transition';
const CARD = 'bg-white rounded-2xl shadow-sm border border-slate-200/70';

let perfil=null, correo='', tours=[], lunes=null, cal=[], dia=null, reservas=[], abiertas=new Set(), tourSel=null, pax=[{}], tab='cal', formAbierto=false, tf=null, cbConfirm=null;
const hoyISO = () => iso(new Date());
const monday = d => { const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); x.setHours(0,0,0,0); return x; };
const tn = id => (tours.find(t=>t.id===id)?.titulo?.es)||'Tour';
const setTab = v => { tab=v; pintar(); };
const setDia = v => { dia=v; pintar(); };
const toggleRes = id => { abiertas.has(id)?abiertas.delete(id):abiertas.add(id); pintar(); };
const setP = (i,k,v) => { pax[i][k]=v; };
function toast(msg,ok){ $('toast').innerHTML=`<div role="status" class="up px-4 py-3 rounded-xl shadow-lg text-sm font-medium text-white ${ok?'bg-emerald-700':'bg-rose-700'}">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>$('toast').innerHTML='',3500); }
function closeModal(){ $('modal').innerHTML=''; tf=null; cbConfirm=null; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
function estadoReal(r){ return (r.estado_pago==='pendiente' && r.expira_at && new Date(r.expira_at)<new Date()) ? 'expirado' : r.estado_pago; }

// ---------- Auth ----------
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return login();
  correo=session.user.email||'';
  const {data}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  perfil=data; if(!perfil) return login('Tu usuario no tiene perfil. Contacta al administrador.');
  const r=await sb.from('tours').select('*').order('created_at'); tours=r.data||[];
  tourSel=tours.find(t=>t.activo)?.id||tours[0]?.id; lunes=monday(new Date()); dia=hoyISO(); tab='cal'; await cargarSemana();
}
function login(msg){
  $('app').innerHTML=`<div class="min-h-screen grid lg:grid-cols-2">
   <div class="hidden lg:flex flex-col justify-between p-12 text-white bg-gradient-to-br from-sky-950 via-sky-900 to-sky-800">
     <div class="flex items-center gap-3 text-xl font-extrabold">${ic('mtn','w-8 h-8')} Vive Km 0</div>
     <div><h2 class="text-4xl font-extrabold leading-tight">Gestiona cupos y reservas<br>de la Patagonia.</h2><p class="mt-4 text-sky-100/90 max-w-md">Calendario de ocupación, agendamientos de socios y control de tours en un solo lugar.</p></div>
     <p class="text-xs text-sky-200/80">Panel de administración</p></div>
   <div class="flex items-center justify-center p-6"><div class="${CARD} w-full max-w-sm p-8 space-y-4 up">
     <div><h1 class="text-2xl font-extrabold text-sky-950">Iniciar sesión</h1><p class="text-sm text-slate-500 mt-1">Acceso para socios y administradores</p></div>
     ${msg?`<p role="alert" class="text-sm text-rose-700 bg-rose-50 rounded-lg p-3">${esc(msg)}</p>`:''}
     <label class="block text-sm font-medium text-slate-700">Correo<input id="em" type="email" autocomplete="username" class="mt-1 block w-full border border-slate-300 rounded-xl p-3 text-base"></label>
     <label class="block text-sm font-medium text-slate-700">Contraseña<input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()" class="mt-1 block w-full border border-slate-300 rounded-xl p-3 text-base"></label>
     <button onclick="entrar()" class="${BTN} w-full py-3">Entrar</button>
     <a href="index.html" class="block text-center text-sm text-slate-500 hover:text-sky-900">← Volver al sitio</a></div></div></div>`;
}
async function entrar(){
  const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(error) return login(error.message); init();
}
async function salir(){ await sb.auth.signOut(); location.href='index.html'; }

// ---------- Datos ----------
async function cargarSemana(){
  const d1=new Date(lunes); d1.setDate(d1.getDate()+6);
  const [c,r]=await Promise.all([
    sb.rpc('calendario_semana',{p_desde:iso(lunes),p_hasta:iso(d1)}),
    sb.from('reservas').select('*, participantes(*), profiles(nombre)').gte('fecha_tour',iso(lunes)).lte('fecha_tour',iso(d1)).order('created_at')
  ]);
  cal=c.data||[]; reservas=r.data||[]; pintar();
}
function irSemana(n){ if(n===0){ lunes=monday(new Date()); dia=hoyISO(); } else { lunes.setDate(lunes.getDate()+7*n); dia=iso(lunes); } cargarSemana(); }

// ---------- Layout ----------
function pintar(){
  const admin=perfil.rol==='admin', ini=(perfil.nombre||correo||'?').trim()[0].toUpperCase();
  $('app').innerHTML=`
  <header class="sticky top-0 z-30 bg-white/85 backdrop-blur border-b border-slate-200">
   <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0"><span class="w-10 h-10 rounded-xl bg-sky-900 text-white flex items-center justify-center">${ic('mtn','w-6 h-6')}</span>
      <div class="leading-tight min-w-0"><b class="block text-sky-950 font-extrabold">Vive Km 0</b><span class="block text-xs text-slate-500">Panel de gestión</span></div></div>
    <div class="flex items-center gap-2 sm:gap-3">
      <div class="hidden sm:flex items-center gap-3 pr-1">
        <span class="w-9 h-9 rounded-full bg-sky-100 text-sky-900 font-bold flex items-center justify-center">${esc(ini)}</span>
        <div class="leading-tight max-w-[200px]"><span class="block text-sm font-semibold text-slate-800 truncate">${esc(perfil.nombre||'')}</span><span class="block text-xs text-slate-500 truncate">${esc(correo)}</span></div></div>
      ${badge(admin?'Admin':'Socio',admin?'bg-amber-100 text-amber-800 ring-1 ring-amber-200':'bg-sky-100 text-sky-800 ring-1 ring-sky-200')}
      ${iconBtn('globe','Ver sitio','text-slate-500 hover:bg-slate-100',"location.href='index.html'")}
      ${iconBtn('out','Cerrar sesión','text-slate-500 hover:bg-rose-50 hover:text-rose-700','salir()')}
    </div></div></header>
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 space-y-6">
    <nav class="inline-flex gap-1 p-1 bg-white rounded-2xl shadow-sm border border-slate-200/70" aria-label="Secciones">
      ${tabBtn('cal','cal','Calendario')}${admin?tabBtn('tours','map','Tours'):''}</nav>
    ${tab==='tours'&&admin?toursHTML():calHTML()}
  </main>`;
}
function tabBtn(id,icon,txt){ const on=tab===id; return `<button onclick="setTab('${id}')" aria-current="${on}" class="flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-semibold transition ${on?'bg-sky-900 text-white shadow':'text-slate-600 hover:bg-slate-100'}">${ic(icon,'w-4 h-4')}${txt}</button>`; }

// ---------- Calendario ----------
function calHTML(){
  const dias=[...Array(7)].map((_,i)=>{const d=new Date(lunes);d.setDate(d.getDate()+i);return iso(d)});
  const totDia=f=>cal.filter(c=>c.fecha===f).reduce((s,c)=>s+c.personas,0);
  const totSem=dias.reduce((s,f)=>s+totDia(f),0), hoy=hoyISO();
  const delDia=reservas.filter(r=>r.fecha_tour===dia);
  const ocup=cal.filter(c=>c.fecha===dia);
  return `<section class="up space-y-6">
   <div class="grid grid-cols-3 gap-3">
     ${stat('Personas en la semana',totSem,'users')}${stat('Personas el '+fmt(dia,{day:'numeric',month:'short'}),totDia(dia),'cal')}${stat('Reservas ese día',delDia.filter(r=>estadoReal(r)!=='expirado').length,'tag')}</div>

   <div class="${CARD} p-4 sm:p-6">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <h2 class="text-lg font-extrabold text-sky-950">${fmt(dias[0],{day:'numeric',month:'short'})} – ${fmt(dias[6],{day:'numeric',month:'short',year:'numeric'})}</h2>
      <div class="flex items-center gap-2">
        <button onclick="irSemana(0)" class="px-3 h-10 rounded-xl text-sm font-semibold text-sky-900 bg-sky-50 hover:bg-sky-100">Hoy</button>
        ${iconBtn('left','Semana anterior','bg-slate-100 hover:bg-slate-200 text-slate-700','irSemana(-1)')}${iconBtn('right','Semana siguiente','bg-slate-100 hover:bg-slate-200 text-slate-700','irSemana(1)')}</div></div>
    <div class="grid grid-cols-7 gap-1.5 sm:gap-3">${dias.map(f=>{
      const n=totDia(f), on=f===dia, es=f===hoy;
      return `<button onclick="setDia('${f}')" aria-pressed="${on}" class="rounded-2xl py-2.5 sm:py-4 px-1 text-center border transition ${on?'bg-sky-900 border-sky-900 text-white shadow-md':es?'bg-white border-orange-400 ring-2 ring-orange-200 hover:bg-orange-50':'bg-white border-slate-200 hover:border-sky-300 hover:bg-sky-50/50'}">
        <div class="text-[11px] sm:text-xs font-semibold uppercase tracking-wide ${on?'text-sky-200':'text-slate-500'}">${fmt(f,{weekday:'short'}).replace('.','')}</div>
        <div class="text-xs ${on?'text-sky-100':'text-slate-400'}">${D(f).getDate()}</div>
        <div class="mt-1 text-2xl sm:text-3xl font-extrabold leading-none ${on?'text-white':n?'text-sky-900':'text-slate-300'}">${n}</div>
        <div class="hidden sm:block text-[11px] mt-1 ${on?'text-sky-200':'text-slate-400'}">personas</div></button>`}).join('')}</div>
   </div>

   <div class="grid lg:grid-cols-3 gap-6 items-start">
    <div class="lg:col-span-2 space-y-3">
      <h3 class="font-extrabold text-sky-950 capitalize">${fmt(dia,{weekday:'long',day:'numeric',month:'long'})}</h3>
      ${delDia.length?delDia.map(cardHTML).join(''):`<div class="${CARD} p-10 text-center text-slate-500"><div class="mx-auto w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 mb-3">${ic('cal','w-6 h-6')}</div>No hay reservas para este día.</div>`}
    </div>
    <aside class="space-y-6">
      <div class="${CARD} p-5"><h3 class="font-extrabold text-sky-950 mb-3">Ocupación del día</h3>
        <div class="space-y-4">${tours.filter(t=>t.activo).map(t=>{ const p=ocup.filter(o=>o.tour_id===t.id).reduce((s,o)=>s+o.personas,0), pct=Math.min(100,Math.round(p/t.cupo_maximo_diario*100));
          return `<div><div class="flex justify-between text-sm mb-1.5"><span class="font-medium text-slate-700 truncate pr-2">${esc(t.titulo.es)}</span><b class="${pct>=100?'text-rose-700':'text-sky-900'}">${p}/${t.cupo_maximo_diario}</b></div>
          <div class="h-2 rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full ${pct>=100?'bg-rose-500':pct>=70?'bg-amber-500':'bg-sky-600'}" style="width:${pct}%"></div></div></div>`}).join('')||'<p class="text-sm text-slate-500">Sin tours activos.</p>'}</div></div>
      ${formHTML()}
    </aside></div></section>`;
}
function stat(lbl,val,icon){ return `<div class="${CARD} p-4 flex items-center gap-3"><span class="hidden sm:flex w-11 h-11 rounded-xl bg-sky-50 text-sky-800 items-center justify-center">${ic(icon)}</span><div><div class="text-2xl sm:text-3xl font-extrabold text-sky-950 leading-none">${val}</div><div class="text-[11px] sm:text-xs text-slate-500 mt-1 leading-tight">${esc(lbl)}</div></div></div>`; }

function cardHTML(r){
  const socio=r.canal_venta==='socio', ab=abiertas.has(r.id), est=estadoReal(r), admin=perfil.rol==='admin';
  const puedeBorrar=admin||r.usuario_id===perfil.id;
  const estB={pagado:'bg-emerald-100 text-emerald-800',pendiente:'bg-amber-100 text-amber-800',expirado:'bg-slate-200 text-slate-600'}[est]||'bg-slate-100 text-slate-700';
  return `<article class="${CARD} overflow-hidden border-l-4 ${socio?'border-l-orange-500':'border-l-sky-700'}">
   <button onclick="toggleRes('${r.id}')" aria-expanded="${ab}" class="w-full text-left p-4 sm:p-5 flex items-center gap-3 hover:bg-slate-50/70 transition">
     <div class="flex-1 min-w-0">
       <div class="font-bold text-sky-950 truncate">${esc(tn(r.tour_id))}</div>
       <div class="mt-1.5 flex flex-wrap items-center gap-2 text-sm text-slate-600"><span class="inline-flex items-center gap-1.5">${ic('users','w-4 h-4')}${r.cantidad_personas} ${r.cantidad_personas===1?'persona':'personas'}</span>
         ${badge(socio?'Socio: '+esc(r.profiles?.nombre||''):'Web directo',socio?'bg-orange-100 text-orange-800':'bg-sky-100 text-sky-800')}</div></div>
     ${badge(est,estB+' capitalize')}<span class="text-slate-400 transition ${ab?'rotate-180':''}">${ic('down')}</span></button>
   ${ab?`<div class="px-4 sm:px-5 pb-5 border-t border-slate-100 up">
     <div class="grid grid-cols-3 gap-3 py-4 text-sm"><div><div class="text-xs text-slate-500">Código</div><b class="font-mono">${esc(r.codigo)}</b></div><div><div class="text-xs text-slate-500">Monto</div><b>${clp(r.monto_total)}</b></div><div><div class="text-xs text-slate-500">ID</div><span class="font-mono text-xs">${r.id.slice(0,8)}</span></div></div>
     <div class="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-2">Pasajeros</div>
     <ul class="divide-y divide-slate-100 rounded-xl border border-slate-100">${(r.participantes||[]).map(p=>`<li class="p-3 flex gap-3">
        <span class="w-9 h-9 shrink-0 rounded-full bg-sky-50 text-sky-800 font-bold flex items-center justify-center">${esc((p.nombre_completo||'?')[0].toUpperCase())}</span>
        <div class="min-w-0 text-sm"><div class="font-semibold text-slate-800">${esc(p.nombre_completo)} <span class="font-normal text-slate-500">· ${esc(p.documento_identidad)}</span></div>
          <div class="mt-0.5 flex flex-wrap gap-x-4 gap-y-0.5 text-slate-600">${p.telefono?`<span class="inline-flex items-center gap-1">${ic('phone','w-3.5 h-3.5')}${esc(p.telefono)}</span>`:''}${p.correo?`<span class="inline-flex items-center gap-1 break-all">${ic('mail','w-3.5 h-3.5')}${esc(p.correo)}</span>`:''}</div>
          ${p.detalles_adicionales?`<div class="mt-1 text-xs text-amber-800 bg-amber-50 rounded-lg px-2 py-1 inline-block">${esc(p.detalles_adicionales)}</div>`:''}</div></li>`).join('')||'<li class="p-3 text-sm text-slate-500">Sin pasajeros registrados.</li>'}</ul>
     <div class="flex justify-end gap-2 mt-4">
       ${admin&&est==='pendiente'?iconBtn('check','Marcar como pagado','bg-emerald-50 text-emerald-700 hover:bg-emerald-100',`pagarRes('${r.id}')`):''}
       ${puedeBorrar?iconBtn('trash','Eliminar reserva','bg-rose-50 text-rose-700 hover:bg-rose-100',`pedirBorrar('${r.id}')`):''}</div></div>`:''}</article>`;
}
function formHTML(){
  const activos=tours.filter(t=>t.activo);
  return `<div class="${CARD} overflow-hidden">
   <button onclick="formAbierto=!formAbierto;pintar()" aria-expanded="${formAbierto}" class="w-full flex items-center justify-between gap-3 p-5 text-left">
     <span class="flex items-center gap-3 font-extrabold text-sky-950"><span class="w-9 h-9 rounded-xl bg-orange-100 text-orange-700 flex items-center justify-center">${ic('plus','w-5 h-5')}</span>Agendar el ${fmt(dia,{day:'numeric',month:'short'})}</span>
     <span class="text-slate-400 transition ${formAbierto?'rotate-180':''}">${ic('down')}</span></button>
   ${formAbierto?`<div class="px-5 pb-5 space-y-3 text-sm up">
    <label class="block font-medium text-slate-700">Tour<select onchange="tourSel=this.value" class="mt-1 block w-full border border-slate-300 rounded-xl p-2.5 text-base bg-white">${activos.map(t=>`<option value="${t.id}" ${t.id===tourSel?'selected':''}>${esc(t.titulo.es)}</option>`).join('')}</select></label>
    ${pax.map((p,i)=>`<fieldset class="border border-slate-200 rounded-xl p-3 grid grid-cols-2 gap-2"><legend class="px-1 text-xs font-semibold text-slate-500">Pasajero ${i+1}</legend>
      ${inp(i,'nombre','Nombre completo *','text',true)}${inp(i,'documento','Documento / Pasaporte *','text')}${inp(i,'telefono','Teléfono','tel')}${inp(i,'correo','Correo','email',true)}${inp(i,'detalles','Restricciones / tallas','text',true)}</fieldset>`).join('')}
    <button onclick="pax.push({});pintar()" class="text-sky-800 font-semibold min-h-[40px]">+ Agregar pasajero</button>
    <button onclick="agendar()" class="${BTN} w-full py-3">Agendar ${pax.length} ${pax.length===1?'persona':'personas'}</button></div>`:''}</div>`;
}
function inp(i,k,label,type,full){ return `<label class="block text-xs font-medium text-slate-600 ${full?'col-span-2':''}">${label}<input type="${type}" value="${esc(pax[i][k])}" oninput="setP(${i},'${k}',this.value)" class="mt-1 block w-full border border-slate-300 rounded-lg p-2 text-base text-slate-900"></label>`; }

async function agendar(){
  if(!tourSel) return toast('Elige un tour',false);
  if(pax.some(p=>!p.nombre?.trim()||!p.documento?.trim())) return toast('Nombre y documento son obligatorios',false);
  const {error}=await sb.rpc('crear_reserva',{p_tour:tourSel,p_fecha:dia,p_participantes:pax});
  if(error) return toast(error.message,false);
  pax=[{}]; formAbierto=false; toast('Reserva agendada',true); cargarSemana();
}
async function pagarRes(id){
  const {error}=await sb.from('reservas').update({estado_pago:'pagado',expira_at:'infinity'}).eq('id',id);
  if(error) return toast(error.message,false); toast('Marcada como pagada',true); cargarSemana();
}
function confirmar(titulo,texto,fn){
  cbConfirm=fn;
  $('modal').innerHTML=`<div class="fixed inset-0 z-50 bg-slate-950/50 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this)closeModal()">
   <div role="alertdialog" aria-modal="true" class="${CARD} w-full max-w-sm p-6 up"><h3 class="font-extrabold text-lg text-sky-950">${titulo}</h3><p class="text-sm text-slate-600 mt-2">${texto}</p>
   <div class="flex justify-end gap-2 mt-6"><button onclick="closeModal()" class="px-4 py-2.5 rounded-xl font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200">Cancelar</button>
   <button onclick="const f=cbConfirm;closeModal();f()" class="px-4 py-2.5 rounded-xl font-semibold text-white bg-rose-700 hover:bg-rose-800">Eliminar</button></div></div></div>`;
}
function pedirBorrar(id){ confirmar('¿Eliminar reserva?','Esta acción libera los cupos y no se puede deshacer.',async()=>{
  const {error}=await sb.from('reservas').delete().eq('id',id); if(error) return toast(error.message,false); toast('Reserva eliminada',true); cargarSemana(); }); }

// ---------- Tours (admin) ----------
function toursHTML(){
  return `<section class="up space-y-5">
   <div class="flex items-center justify-between gap-3"><div><h2 class="text-xl font-extrabold text-sky-950">Tours</h2><p class="text-sm text-slate-500">${tours.length} ${tours.length===1?'tour registrado':'tours registrados'}</p></div>
     <button onclick="editarTour()" class="${BTN} px-5 py-3 flex items-center gap-2">${ic('plus','w-5 h-5')}Nuevo tour</button></div>
   <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">${tours.map(t=>`<article class="${CARD} overflow-hidden flex flex-col hover:shadow-md transition">
     <div class="relative h-36 bg-gradient-to-br from-sky-800 to-sky-950">${(t.imagenes||[])[0]?`<img src="${esc(t.imagenes[0])}" alt="" loading="lazy" class="w-full h-full object-cover">`:`<div class="h-full flex items-center justify-center text-white/40">${ic('mtn','w-12 h-12')}</div>`}
       <span class="absolute top-3 left-3">${badge(t.activo?'Activo':'Inactivo',t.activo?'bg-emerald-100 text-emerald-800':'bg-slate-200 text-slate-600')}</span></div>
     <div class="p-5 flex-1 flex flex-col gap-3"><h3 class="font-bold text-lg text-sky-950 leading-snug">${esc(t.titulo.es)}</h3>
       <div class="flex flex-wrap gap-2 text-sm"><span class="inline-flex items-center gap-1.5 bg-slate-100 text-slate-700 rounded-full px-3 py-1">${ic('users','w-4 h-4')}Cupo ${t.cupo_maximo_diario}/día</span>
         ${t.punto_encuentro?`<span class="inline-flex items-center gap-1.5 bg-slate-100 text-slate-700 rounded-full px-3 py-1 max-w-full truncate">${ic('pin','w-4 h-4')}${esc(t.punto_encuentro)}</span>`:''}</div>
       <div class="mt-auto flex items-center justify-between pt-3 border-t border-slate-100"><b class="text-xl text-sky-950">${clp(t.precio_clp)}</b>
         <div class="flex gap-1">${iconBtn('edit','Editar tour','text-sky-800 hover:bg-sky-50',`editarTour('${t.id}')`)}${iconBtn('trash','Eliminar tour','text-rose-700 hover:bg-rose-50',`pedirBorrarTour('${t.id}')`)}</div></div></div></article>`).join('')}</div>
   ${tours.length?'':`<div class="${CARD} p-12 text-center text-slate-500">Aún no hay tours. Crea el primero con “Nuevo tour”.</div>`}</section>`;
}
function editarTour(id){
  const t=tours.find(x=>x.id===id);
  tf=t?{id:t.id,es:t.titulo.es||'',pt:t.titulo.pt||'',en:t.titulo.en||'',precio:t.precio_clp,cupo:t.cupo_maximo_diario,punto:t.punto_encuentro||'',img:(t.imagenes||[])[0]||'',activo:t.activo,imgs:t.imagenes||[]}
          :{es:'',pt:'',en:'',precio:'',cupo:12,punto:'',img:'',activo:true,imgs:[]};
  const f=(k,l,type,req,ph)=>`<label class="block text-sm font-medium text-slate-700">${l}${req?' *':''}<input type="${type}" ${type==='number'?'min="1"':''} placeholder="${ph||''}" value="${esc(tf[k])}" oninput="tf.${k}=this.value" class="mt-1 block w-full border border-slate-300 rounded-xl p-2.5 text-base"></label>`;
  $('modal').innerHTML=`<div class="fixed inset-0 z-50 bg-slate-950/50 backdrop-blur-sm overflow-auto p-4" onclick="if(event.target===this)closeModal()">
   <div role="dialog" aria-modal="true" class="${CARD} max-w-lg mx-auto my-6 up">
    <div class="flex items-center justify-between px-6 py-4 border-b"><h3 class="font-extrabold text-lg text-sky-950">${t?'Editar tour':'Nuevo tour'}</h3>${iconBtn('x','Cerrar','text-slate-500 hover:bg-slate-100','closeModal()')}</div>
    <div class="p-6 grid grid-cols-2 gap-4">
      <div class="col-span-2">${f('es','Título (Español)','text',true)}</div>${f('pt','Título (Português)','text')}${f('en','Title (English)','text')}
      ${f('precio','Precio por persona (CLP)','number',true,'85000')}${f('cupo','Cupo máximo diario','number',true)}
      <div class="col-span-2">${f('punto','Punto de encuentro','text')}</div><div class="col-span-2">${f('img','URL de la imagen','url',false,'https://…')}</div>
      <label class="col-span-2 flex items-center gap-3 text-sm font-medium text-slate-700 cursor-pointer"><input type="checkbox" ${tf.activo?'checked':''} onchange="tf.activo=this.checked" class="w-5 h-5 rounded accent-sky-900">Tour activo (visible en la web)</label></div>
    <div class="flex justify-end gap-2 px-6 py-4 border-t bg-slate-50 rounded-b-2xl"><button onclick="closeModal()" class="px-4 py-2.5 rounded-xl font-semibold text-slate-700 bg-slate-200/70 hover:bg-slate-200">Cancelar</button><button onclick="guardarTour()" class="${BTN} px-5 py-2.5">Guardar</button></div></div></div>`;
}
async function guardarTour(){
  if(!tf.es.trim()) return toast('El título en español es obligatorio',false);
  const precio=Math.round(+tf.precio), cupo=Math.round(+tf.cupo);
  if(!(precio>0)||!(cupo>0)) return toast('Precio y cupo deben ser mayores a 0',false);
  const imgs=[...tf.imgs]; if(tf.img.trim()) imgs[0]=tf.img.trim(); else imgs.shift();
  const row={titulo:{es:tf.es.trim(),pt:tf.pt.trim()||tf.es.trim(),en:tf.en.trim()||tf.es.trim()},precio_clp:precio,cupo_maximo_diario:cupo,punto_encuentro:tf.punto.trim()||null,activo:tf.activo,imagenes:imgs};
  const {error}= tf.id ? await sb.from('tours').update(row).eq('id',tf.id) : await sb.from('tours').insert(row);
  if(error) return toast(error.message,false);
  closeModal(); toast('Tour guardado',true);
  const r=await sb.from('tours').select('*').order('created_at'); tours=r.data||[]; if(!tours.find(t=>t.id===tourSel)) tourSel=tours.find(t=>t.activo)?.id; pintar();
}
function pedirBorrarTour(id){ confirmar('¿Eliminar tour?','Si el tour tiene reservas no se podrá eliminar; en ese caso desactívalo desde “Editar”.',async()=>{
  const {error}=await sb.from('tours').delete().eq('id',id);
  if(error) return toast(error.code==='23503'?'No se puede eliminar: tiene reservas. Desactívalo en su lugar.':error.message,false);
  toast('Tour eliminado',true); const r=await sb.from('tours').select('*').order('created_at'); tours=r.data||[]; pintar(); }); }

init();
</script></body></html>
